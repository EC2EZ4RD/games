<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>宗师之上</title>
  <link rel="stylesheet" href="./css/style.css?v=14" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app-backdrop"></div>

  <div id="layout-root">
    <!-- 1080×1920 等比 9:16 竖屏游戏主舞台（100% 纯净原版 UI 图集与美术） -->
    <div id="game-shell">
      <!-- 登录开屏（1:1 原版 login.mp4 御剑登仙动态视频 + 零起点创角起名 + 解锁真实 BGM 音频） -->
      <div id="splash-screen">
        <video class="splash-video-bg" src="./game-assets/apk/assets/Videos/login.mp4" autoplay loop muted playsinline></video>
        <div class="splash-overlay"></div>
        <div class="splash-content">
          <div class="splash-name-row">
            <span class="splash-name-label">少侠名号</span>
            <input id="inp-player-name" class="splash-name-input" type="text" maxlength="8" value="嵩山少侠" placeholder="输入侠客名号" />
            <button id="btn-rand-name" class="splash-rand-btn" type="button" title="随机生成武侠名号">随机</button>
          </div>
          <button id="btn-enter-game" class="btn-gold-lg">踏入江湖</button>
          <div class="splash-hint">武徒·一重 · 关卡 1-1 全新零起点开局</div>
        </div>
      </div>

      <!-- 顶部全局状态栏（严格对齐 003_enter.png / 012_tab_shimen.png ComTopPlayerMini） -->
      <header id="top-bar">
        <button id="pill-realm" class="top-pill realm-pill" title="点击前往修为突破">
          <img class="realm-npc-icon" src="./ui_sprites/com_playerinfo_npc.png" alt="" />
          <span class="realm-text">
            <strong id="hud-realm-name">武者·一重</strong>
            <small id="hud-realm-pct">4.67%</small>
          </span>
          <img id="realm-red-dot" class="badge-dot hidden" src="./ui_sprites/com_tag_redpoint_01.png" alt="!" />
        </button>

        <div class="top-pill power-pill">
          <img class="hud-icon" src="./ui_sprites/com_power_icon2.png" alt="" />
          <span id="hud-power">61833</span>
        </div>

        <!-- 货币胶囊仅在师门/天书/背包等界面展示，练功页按 003_enter.png 自动隐藏 -->
        <div id="pill-currency" class="top-pill stone-pill hidden" title="灵石（研习秘籍、天书、强化）">
          <img class="hud-icon" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/item/1351.png" alt="" />
          <span id="hud-stone">360</span>
          <button id="btn-currency-plus" class="currency-plus-btn" title="获取灵石补给">
            <img src="./ui_sprites/com_btn_icon_02.png" alt="+" />
          </button>
        </div>
      </header>

      <!-- 主内容区域（6大页签切换，全屏透底 3D 画布！） -->
      <main id="viewport">
        <!-- TAB 3: 练功（1:1 对照 003_enter.png：全屏 3D 林间砂土路 + 原版图集 HUD + 无杂物透底合成牌桌） -->
        <section id="tab-lianggong" class="tab-view active">
          <div id="battle-stage">
            <canvas id="battle-webgl"></canvas>
            <canvas id="battle-canvas"></canvas>
          </div>

          <!-- 上半屏战斗浮动 HUD（100% 原版 wooden.ab / worldcombat.ab / com.ab 精灵） -->
          <div class="battle-hud-overlay">
            <div class="battle-left-hud">
              <button id="btn-stage-info" class="stage-badge-btn" title="关卡详情">
                <div class="stage-circle-icon">
                  <img class="chapter-crest" src="./ui_sprites/wooden_icon_chapter.png" alt="" />
                  <span class="stage-zoom-badge">
                    <img src="./ui_sprites/wooden_btn_detail.png" alt="" />
                  </span>
                </div>
                <span id="hud-stage-tag" class="stage-white-pill">小怪 1-1</span>
              </button>

              <div class="wave-vert-wrap">
                <div class="wave-bar">
                  <div id="hud-wave-fill"></div>
                </div>
                <div class="wave-nums">
                  <span class="wave-row">
                    <img src="./ui_sprites/wooden_icon_boss.png" alt="" />
                    <b id="hud-enemy-rem">x7</b>
                  </span>
                  <span class="wave-row">
                    <img src="./ui_sprites/com_map_icon_clock.png" alt="" />
                    <b id="hud-timer">108秒</b>
                  </span>
                </div>
              </div>

              <button id="btn-idle-bag" class="float-pouch-btn" title="挂机奖励">
                <img class="pouch-bg" src="./ui_sprites/com_btn_function_bg_02.png" alt="" />
                <img class="pouch-icon" src="./ui_sprites/worldcombat_icon_gain.png" alt="挂机" />
                <img id="idle-dot" class="badge-dot hidden" src="./ui_sprites/com_tag_redpoint_02.png" alt="" />
              </button>

              <button id="btn-quick-tianshu" class="float-tianshu-btn" title="天书">
                <img class="ts-bg" src="./ui_sprites/com_btn_white_bg.png" alt="" />
                <img class="ts-icon" src="./ui_sprites/wooden_btn_skill.png" alt="天书" />
                <small>天书</small>
                <img id="tianshu-dot" class="badge-dot hidden" src="./ui_sprites/com_tag_redpoint_02.png" alt="" />
              </button>
            </div>

            <div class="battle-right-hud">
              <button id="btn-speed" class="speed-btn">x1</button>
              <button id="btn-bond-lotus" class="hex-bond-btn" title="查看门派羁绊">
                <img class="hex-bg" src="./ui_sprites/wooden_skill_link_bg.png" alt="" />
                <div id="bond-hex-petals" class="hex-petals">
                  <img class="hex-petal p0" src="./ui_sprites/wooden_skill_2001_02.png" alt="" />
                  <img class="hex-petal p1" src="./ui_sprites/wooden_skill_2001_02.png" alt="" />
                  <img class="hex-petal p2" src="./ui_sprites/wooden_skill_2001_02.png" alt="" />
                  <img class="hex-petal p3" src="./ui_sprites/wooden_skill_2001_02.png" alt="" />
                  <img class="hex-petal p4" src="./ui_sprites/wooden_skill_2001_02.png" alt="" />
                  <img class="hex-petal p5" src="./ui_sprites/wooden_skill_2001_02.png" alt="" />
                </div>
              </button>
            </div>

            <!-- 左下「前往领奖 / 师姐的教诲」原版渐变任务条 (003_enter.png + 042_chapter_claim.png) -->
            <button id="btn-quest-bar" class="quest-banner">
              <span id="hud-quest-text">前往领奖</span>
              <img id="quest-dot" class="quest-chest-dot" src="./ui_sprites/com_tag_redpoint_02.png" alt="" />
            </button>
          </div>

          <!-- 下半屏悬浮区：5+1 原版上阵槽 + 100% 透底无杂物 6×3 合成棋盘 -->
          <div class="battle-bottom-deck">
            <div id="skill-slots-wrap">
              <div id="skill-slots" class="skill-slots"></div>
            </div>

            <div id="merge-panel">
              <div id="merge-grid" class="merge-grid"></div>
            </div>
          </div>
        </section>

        <!-- TAB 1: 角色（1:1 对照 006_tab_role.png 全屏 3D 草原展示 + 原版头像顶栏 + 悬浮属性与装备格） -->
        <section id="tab-role" class="tab-view">
          <div class="role-screen" id="role-screen"></div>
        </section>

        <!-- TAB 2: 师门（总览 + 修为 + 天书 + 神兵） -->
        <section id="tab-shimen" class="tab-view">
          <div id="shimen-container" class="shimen-container"></div>
        </section>

        <!-- TAB 4: 游历 -->
        <section id="tab-youli" class="tab-view">
          <div id="youli-container" class="youli-container"></div>
        </section>

        <!-- TAB 5: 帮派 -->
        <section id="tab-bangpai" class="tab-view">
          <div id="bangpai-container" class="bangpai-container"></div>
        </section>

        <!-- TAB 6: 背包 -->
        <section id="tab-bag" class="tab-view">
          <div id="bag-container" class="bag-container"></div>
        </section>
      </main>

      <!-- 底部 6 大四叶菱形导航栏（1:1 复刻 WorldCombatBottom：仅选中态展露彩绘立绘图标，未选中为纯净四叶菱形，未解锁带灰锁） -->
      <nav id="bottom-nav">
        <button class="nav-btn" data-tab="role">
          <img class="nav-diamond-bg" src="./ui_sprites/worldcombat_idle_buttom.png" alt="" />
          <img class="nav-active-art" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/function/worldcombat_active_character.png" alt="" />
          <span class="nav-label">角色</span>
        </button>
        <button class="nav-btn" data-tab="shimen">
          <img class="nav-diamond-bg" src="./ui_sprites/worldcombat_idle_buttom.png" alt="" />
          <img class="nav-active-art" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/function/worldcombat_active_gate_01.png" alt="" />
          <span class="nav-label">师门</span>
          <img id="nav-dot-shimen" class="nav-chest-dot hidden" src="./ui_sprites/com_tag_redpoint_02.png" alt="" />
        </button>
        <button class="nav-btn active" data-tab="lianggong">
          <img class="nav-diamond-bg" src="./ui_sprites/worldcombat_active_buttom.png" alt="" />
          <img class="nav-active-art" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/function/worldcombat_active_wooden_01.png" alt="" />
          <span class="nav-label">练功</span>
          <img id="nav-dot-lianggong" class="nav-chest-dot hidden" src="./ui_sprites/com_tag_redpoint_02.png" alt="" />
        </button>
        <button class="nav-btn locked-look" data-tab="youli">
          <img class="nav-diamond-bg" src="./ui_sprites/worldcombat_lock_buttom.png" alt="" />
          <img class="nav-active-art" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/function/worldcombat_active_world_01.png" alt="" />
          <span class="nav-label">游历</span>
        </button>
        <button class="nav-btn locked-look" data-tab="bangpai">
          <img class="nav-diamond-bg" src="./ui_sprites/worldcombat_lock_buttom.png" alt="" />
          <img class="nav-active-art" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/function/worldcombat_active_guild_01.png" alt="" />
          <span class="nav-label">帮派</span>
        </button>
        <button class="nav-btn" data-tab="bag">
          <img class="nav-diamond-bg" src="./ui_sprites/worldcombat_idle_buttom.png" alt="" />
          <img class="nav-active-art" src="./game-assets/textures/assets/resourcesab/ui_new/uiimage/icon/function/worldcombat_active_bag.png" alt="" />
          <span class="nav-label">背包</span>
        </button>
      </nav>

      <!-- 通用弹窗层 (KawaseBlur) / 恭喜获得全屏金芒 / Toast / 拖拽幽灵 -->
      <div id="modal-root" class="hidden"></div>
      <div id="reveal-root" class="hidden"></div>
      <div id="toast-root"></div>
      <div id="drag-ghost" class="hidden"></div>
    </div>

    <!-- 手机窄屏专属侧边折叠悬浮球（桌面端自动隐藏，方便内部同事手机浏览器全屏试玩时呼出助手） -->
    <button id="btn-mobile-sb" class="mobile-sb-fab hidden" type="button" title="展开/收起体验助手">助手</button>

    <!-- 桌面端右侧可选「本地体验助手」面板（所有调试/辅助按钮外置，保持左侧手机框 100% 纯净原版画面！） -->
    <aside id="sandbox-panel">
      <div class="sb-header">
        <h3>宗师之上 · 体验助手</h3>
        <div style="display:flex;gap:6px;align-items:center">
          <button id="btn-mute" class="sb-mute-btn" title="静音/开启原版配乐">配乐: 开</button>
          <button id="btn-close-sb" class="sb-close-mobile" type="button">收起</button>
        </div>
      </div>
      <div class="sb-section">
        <h4>快捷合成与试玩工具</h4>
        <div class="sb-btn-grid">
          <button id="btn-comprehend" class="sb-btn gold">领悟新秘籍（消耗 60 灵石）</button>
          <button id="btn-auto-merge" class="sb-btn jade">一键合成（当前升阶率 <span id="merge-pity-pct">50%</span>）</button>
          <label class="sb-check-row">
            <input type="checkbox" id="chk-batch-merge" checked />
            <span>勾选后一键连续批量合成</span>
          </label>
          <button id="sb-gift" class="sb-btn amber">领取体验补给包（灵石+秘籍+混元青）</button>
          <button id="sb-high" class="sb-btn purple">解锁全系统并投放红/橙绝学</button>
          <button id="sb-xp" class="sb-btn jade">充满当前境界修为</button>
          <button id="sb-jump-boss" class="sb-btn amber">直面当前章节首领</button>
          <button id="sb-next-ch" class="sb-btn blue">切换下一章节地貌</button>
          <button id="sb-reset" class="sb-btn danger">从零重新开始（清空存档回开屏）</button>
        </div>
      </div>
      <div class="sb-section">
        <h4>核心机制说明</h4>
        <ul>
          <li><b>二合一升阶：</b>拖 2 本同品秘籍叠放，基础 50% 升阶，每次失败 +25% 保底必成！</li>
          <li><b>经验球升重：</b>同色球二合一，拖至武学槽提升重数（每 5 重额外 +13.5% 爆发）！</li>
          <li><b>师姐的教诲：</b>点击左下「前往领奖」打开章节任务领取混元青与紫秘籍！</li>
        </ul>
      </div>
      <div class="sb-section sb-live">
        <h4>当前实时属性</h4>
        <div id="sb-stats-box" class="sb-stats-box"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="./js/main.js?v=14"></script>
