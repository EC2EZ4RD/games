<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="fonts/hub-display.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="hub.css" />
  <style>
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background:
        radial-gradient(90% 120% at 25% 50%, color-mix(in srgb, var(--accent, #888) 38%, var(--paper)) 0%, var(--paper) 70%);
    }
    .player {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 72px);
      padding: 24px;
    }
    .phone {
      position: relative;
      height: min(844px, calc(100vh - 48px));
      aspect-ratio: 390 / 844;
      flex: none;
      background: var(--bezel);
      border: 11px solid var(--bezel);
      border-radius: 44px;
      box-shadow: 10px 12px 0 rgba(0, 0, 0, 0.22), 0 0 0 2.5px var(--line);
    }
    .phone iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 33px; background: #000; }
    .side-panel { width: 340px; display: flex; flex-direction: column; gap: 14px; }
    .side-panel h1 { margin: 6px 0 0; font: 400 46px/1.1 var(--display); text-shadow: 3px 3px 0 var(--accent); }
    .side-panel h1.long { font-size: 36px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .hint { display: flex; gap: 8px; align-items: center; color: var(--ink-soft); font-size: 14px; }
    .back { align-self: flex-start; }
    .qr-card {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 6px;
      padding: 12px;
      color: #221f2e;
      background: #fff;
      border: 2.5px solid var(--line);
      border-radius: 14px;
      box-shadow: 4px 4px 0 var(--line);
      font-size: 13px;
      line-height: 1.5;
    }
    .qr-card img { width: 112px; height: 112px; flex: none; }
    .qr-card b { display: block; font: 400 18px/1.3 var(--display); }
    @media (max-width: 760px) { .side-panel { display: none; } }
  </style>
</head>
<body>
  {{icons}}
  <div class="player">
    <div class="phone"><iframe id="game" title="游戏" allow="autoplay; fullscreen; gamepad; screen-wake-lock"></iframe></div>
    <aside class="side-panel">
      <a class="side back" href="./"><svg class="i"><use href="#i-home"/></svg>回大厅</a>
      <h1 id="name"></h1>
      <p class="pitch" id="pitch"></p>
      <ul class="tags" id="tags"></ul>
      <p class="hint"><svg class="i"><use href="#i-mouse"/></svg>用鼠标点、按住、拖动，和手指一样</p>
      <div class="row">
        <a class="side" id="full"><svg class="i"><use href="#i-expand"/></svg>整页打开</a>
        <a class="side" id="taptap" target="_blank" rel="noopener" hidden><svg class="i"><use href="#i-ext"/></svg>TapTap</a>
      </div>
      <div class="qr-card"><img id="qr" alt="这个游戏的二维码" /><div><b>手机扫一扫</b>竖屏游戏在手机上玩最顺手</div></div>
    </aside>
  </div>
  <script>
    (async () => {
      const slug = new URLSearchParams(location.search).get('g') || '';
      const site = await (await fetch('games.json', { cache: 'no-cache' })).json();
      const g = site.games.find((x) => x.slug === slug);
      if (!g) { location.replace('./'); return; }
      const direct = './' + g.slug + '/';
      // on a phone or a narrow window the game takes the whole page
      if (matchMedia('(pointer: coarse)').matches || innerWidth < 760) { location.replace(direct); return; }
      document.title = g.title + ' · ' + site.title;
      document.body.style.setProperty('--accent', g.accent);
      const name = document.getElementById('name');
      name.textContent = g.title;
      if (g.title.length > 6) name.classList.add('long');
      document.getElementById('pitch').textContent = g.pitch;
      document.getElementById('tags').innerHTML = g.tagsHtml || '';
      document.getElementById('full').href = direct;
      document.getElementById('qr').src = 'qr/' + g.slug + '.svg';
      if (g.taptap) { const t = document.getElementById('taptap'); t.href = g.taptap; t.hidden = false; }
      const frame = document.getElementById('game');
      frame.src = direct;
      frame.addEventListener('load', () => frame.focus());
    })();
  </script>
</body>
</html>
