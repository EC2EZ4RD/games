    <!--
      Boot guard. Plain ES5 in a classic script, so it parses in any WebView, even one too old for the game's bundle
      (TapTap review 51130882: an old Android system WebView died on syntax, leaving a title whose buttons did nothing).
      If a script error comes before main.ts sets window.__meowBooted, or the page has loaded and 6 s later the game
      still has not started, it covers the page with a note: what probably went wrong, what to try, and a retry button.
      A slow download never trips it (the clock starts at the load event); it sends nothing anywhere.
    -->

        var w = window;
        var doc = document;
        var parsed = false;
        var shown = false;
        var fault = '';
        var started = function () { return w.__meowBooted === true; };
        // an error before the page's scripts have run (one from the host app, say) only counts if the game then
        // still has not started: decided at DOMContentLoaded, when the game's module has run or died
        var fail = function (why) {
          if (started() || shown) return;
          if (!fault) fault = why || 'Error';
          if (parsed) show();
        };
        w.addEventListener('error', function (e) {
          var t = e && e.target;
          // a missing image or file is not a script error (a missing game bundle is the timer's case)
          if (t && t !== w && t.nodeType === 1) return;
          fail(String((e && e.message) || (e && e.error) || 'Error').replace(/^Uncaught /, ''));
        });
        w.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          fail('Promise: ' + String((r && r.message) || r));
        });
        doc.addEventListener('DOMContentLoaded', function () {
          parsed = true;
          if (fault) show();
        });
        w.addEventListener('load', function () {
          w.setTimeout(function () {
            if (!started()) show();
          }, 6000);
        });

        var esc = function (s) {
          return String(s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          });
        };
        var row = function (cls, icon, text) {
          return '<div class="' + cls + '"><span class="bf-ico" aria-hidden="true">' + icon + '</span><span>' + text + '</span></div>';
        };
        var webgl2 = function () {
          try {
            return !!(w.WebGL2RenderingContext && doc.createElement('canvas').getContext('webgl2'));
          } catch (e) {
            return false;
          }
        };

        function show() {
          if (shown || started() || !doc.body) return;
          shown = true;
          var ua = navigator.userAgent || '';
          var m = /Chrom(?:e|ium)\/(\d+)/.exec(ua);
          var chrome = m ? +m[1] : 0;
          var ios = /iPhone|iPad|iPod/.test(ua);

          // the UA decides: on 79+ a SyntaxError is likelier a download that broke off, so it gets the generic reason
          // and the 📡 tip. Without one (iOS, say) a SyntaxError means the engine cannot read the game

    pct.textContent = p + '%';
    mb.textContent = size(Math.min(got, C.total)) + ' / ' + size(C.total) + ' MB';
    root.setAttribute('aria-valuenow', String(p));

    got += n;
    if (queued) return;

  if (window.fetch && C.files.length) {

    check();
  }, 1000);
  function check() {
    if (over || failed) return;

  }

    if (gone) return;
    gone = true;
    root.className += ' out';
    setTimeout(function () { if (root.parentNode) root.parentNode.removeChild(root); }, 450);
  }
  function fail() {
    if (over || failed) return;
    failed = true;
    root.className += ' fail';
    hint.textContent = '\u6ca1\u52a0\u8f7d\u51fa\u6765\uff0c\u53ef\u80fd\u662f\u7f51\u7edc\u65ad\u4e86';
  }
